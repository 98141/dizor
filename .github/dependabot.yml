# Dependabot — revisión automática de dependencias vulnerables/desactualizadas.
# GitHub abre un Pull Request cuando hay actualizaciones (prioriza las de seguridad).
# Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # --- Backend (Express/Node) ---
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "deps(backend)"
    # Agrupa actualizaciones menores/parche en un solo PR para reducir ruido
    groups:
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- Frontend (Next.js) ---
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps(frontend)"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions (si añades workflows en el futuro) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
